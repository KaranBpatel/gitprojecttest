

<html>

<h1>Salesforce Embedded Messaging Test Auto Open</h1>
    </head>
    <body>
		<script>
			window.addEventListener("onEmbeddedMessagingReady", () => {
    waitForLauncher();
});

function waitForLauncher() {
    const timer = setInterval(() => {
        const launcher = document.querySelector(".embeddedMessagingConversationButton");

        if (launcher) {
            clearInterval(timer);

            // Prevent opening multiple times
            if (!sessionStorage.getItem("chatOpened")) {
                launcher.click();
                sessionStorage.setItem("chatOpened", "true");
            }
        }
    }, 500);
}
		</script>
		<script type='text/javascript'>
	function initEmbeddedMessaging() {
		try {
			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'

			embeddedservice_bootstrap.init(
				'00DgL00000PH0d7',
				'External_Site_Deploy',
				'https://orgfarm-c1a5b63a6e-dev-ed.develop.my.site.com/ESWExternalSiteDeploy1785171746138',
				{
					scrt2URL: 'https://orgfarm-c1a5b63a6e-dev-ed.develop.my.salesforce-scrt.com'
				}
			);
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	};
</script>
